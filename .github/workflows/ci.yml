name: CI

on:
  pull_request:
  push:
    branches: [main]

# Quyền tối thiểu cho GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Build không cần secret: VITE_SUPABASE_* thật được đặt trên nền tảng deploy (Vercel).
      - run: npm run build
